  <!-- Celdas pintadas: cumple (liso), no cumple (rayas), sin dato (puntos) -->
  <rect x="650" y="660" width="50" height="50" class="p-ok"/><rect x="700" y="660" width="50" height="50" class="p-ok"/><rect x="750" y="660" width="50" height="50" class="p-no"/><rect x="800" y="660" width="50" height="50" class="p-no"/><rect x="850" y="660" width="50" height="50" class="p-dato"/><rect x="650" y="710" width="50" height="50" class="p-ok"/><rect x="700" y="710" width="50" height="50" class="p-ok"/><rect x="750" y="710" width="50" height="50" class="p-ok"/><rect x="800" y="710" width="50" height="50" class="p-no"/><rect x="850" y="710" width="50" height="50" class="p-dato"/><rect x="650" y="760" width="50" height="50" class="p-no"/><rect x="700" y="760" width="50" height="50" class="p-ok"/><rect x="750" y="760" width="50" height="50" class="p-ok"/><rect x="800" y="760" width="50" height="50" class="p-ok"/><rect x="850" y="760" width="50" height="50" class="p-no"/>

  <!-- Punto elegido -->
  <g transform="translate(775 735)">
    <circle r="46" fill="none" stroke="var(--linea)" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/>
    <path d="M0 0C-8 -13 -19 -25 -19 -43a19 19 0 0 1 38 0C19 -25 8 -13 0 0Z" fill="var(--linea)" stroke="var(--papel)" stroke-width="2.5"/>
    <circle cy="-43" r="7" fill="var(--papel)"/>
  </g>

  <!-- Marcas de registro, norte y escala -->
  <g class="l" opacity=".6">
    <path d="M30 16v28M16 30h28"/><path d="M1170 16v28M1156 30h28"/><path d="M30 856v28M16 870h28"/><path d="M1170 856v28M1156 870h28"/>
