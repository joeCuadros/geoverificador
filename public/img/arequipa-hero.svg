  <rect x="657" y="667" width="36" height="36" rx="2" class="mz"/><rect x="707" y="667" width="36" height="36" rx="2" class="mz"/><rect x="757" y="667" width="36" height="36" rx="2" class="mz"/><rect x="807" y="667" width="36" height="36" rx="2" class="mz"/><rect x="857" y="667" width="36" height="36" rx="2" class="mz"/><rect x="657" y="717" width="36" height="36" rx="2" class="mz"/><rect x="707" y="717" width="36" height="36" rx="2" class="mz"/><rect x="757" y="717" width="36" height="36" rx="2" class="mz"/><rect x="807" y="717" width="36" height="36" rx="2" class="mz"/><rect x="857" y="717" width="36" height="36" rx="2" class="mz"/><rect x="657" y="767" width="36" height="36" rx="2" class="mz"/><rect x="707" y="767" width="36" height="36" rx="2" class="mz"/><rect x="757" y="767" width="36" height="36" rx="2" class="mz"/><rect x="807" y="767" width="36" height="36" rx="2" class="mz"/><rect x="857" y="767" width="36" height="36" rx="2" class="mz"/>
  <rect x="457" y="567" width="36" height="36" rx="2" class="mz"/><rect x="557" y="567" width="36" height="36" rx="2" class="mz"/><rect x="657" y="567" width="36" height="36" rx="2" class="mz"/><rect x="707" y="567" width="36" height="36" rx="2" class="mz"/><rect x="807" y="567" width="36" height="36" rx="2" class="mz"/><rect x="907" y="567" width="36" height="36" rx="2" class="mz"/><rect x="507" y="617" width="36" height="36" rx="2" class="mz"/><rect x="557" y="617" width="36" height="36" rx="2" class="mz"/><rect x="657" y="617" width="36" height="36" rx="2" class="mz"/><rect x="707" y="617" width="36" height="36" rx="2" class="mz"/><rect x="757" y="617" width="36" height="36" rx="2" class="mz"/><rect x="807" y="617" width="36" height="36" rx="2" class="mz"/><rect x="857" y="617" width="36" height="36" rx="2" class="mz"/><rect x="907" y="617" width="36" height="36" rx="2" class="mz"/><rect x="557" y="667" width="36" height="36" rx="2" class="mz"/><rect x="607" y="667" width="36" height="36" rx="2" class="mz"/><rect x="557" y="717" width="36" height="36" rx="2" class="mz"/><rect x="607" y="717" width="36" height="36" rx="2" class="mz"/><rect x="957" y="717" width="36" height="36" rx="2" class="mz"/><rect x="557" y="767" width="36" height="36" rx="2" class="mz"/><rect x="607" y="767" width="36" height="36" rx="2" class="mz"/><rect x="907" y="767" width="36" height="36" rx="2" class="mz"/><rect x="657" y="817" width="36" height="36" rx="2" class="mz"/><rect x="707" y="817" width="36" height="36" rx="2" class="mz"/><rect x="757" y="817" width="36" height="36" rx="2" class="mz"/><rect x="807" y="817" width="36" height="36" rx="2" class="mz"/><rect x="857" y="817" width="36" height="36" rx="2" class="mz"/><rect x="907" y="817" width="36" height="36" rx="2" class="mz"/><rect x="957" y="817" width="36" height="36" rx="2" class="mz"/><rect x="557" y="867" width="36" height="36" rx="2" class="mz"/><rect x="607" y="867" width="36" height="36" rx="2" class="mz"/><rect x="657" 