  <path d="M0 560H1200" class="l" style="stroke-width:2"/>
  <path d="M0 560v14" class="l"/><path d="M50 560v8" class="l"/><path d="M100 560v14" class="l"/><path d="M150 560v8" class="l"/><path d="M200 560v14" class="l"/><path d="M250 560v8" class="l"/><path d="M300 560v14" class="l"/><path d="M350 560v8" class="l"/><path d="M400 560v14" class="l"/><path d="M450 560v8" class="l"/><path d="M500 560v14" class="l"/><path d="M550 560v8" class="l"/><path d="M600 560v14" class="l"/><path d="M650 560v8" class="l"/><path d="M700 560v14" class="l"/><path d="M750 560v8" class="l"/><path d="M800 560v14" class="l"/><path d="M850 560v8" class="l"/><path d="M900 560v14" class="l"/><path d="M950 560v8" class="l"/><path d="M1000 560v14" class="l"/><path d="M1050 560v8" class="l"/><path d="M1100 560v14" class="l"/><path d="M1150 560v8" class="l"/><path d="M1200 560v14" class="l"/>

  <!-- Rio Chili y una quebrada -->
  <path d="M472 560C440 610 520 650 470 700S400 770 440 820S400 880 392 900" class="rio"/>
  <path d="M472 560C440 610 520 650 470 700S400 770 440 820S400 880 392 900" class="rio-c"/>
  <path d="M310 900C330 860 380 840 420 822" class="rio" style="stroke-width:5"/>

